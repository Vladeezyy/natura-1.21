plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // what NeoForge opens and the common code uses (compile only; Fabric: the access widener)
    accessTransformers.from(file('accesstransformer.cfg'))
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    // mixins live in common, both loaders ship Mixin at runtime
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    // MixinExtras ships with both loaders (NeoForge and Fabric Loader bundle it)
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    // Jade (the 1.12 Waila plugin): the API is the same in the NeoForge and the Fabric jar
    compileOnly "maven.modrinth:jade:${jade_version}+neoforge"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
