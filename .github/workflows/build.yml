# Build on every push and pull request, then the GameTests on headless servers of both loaders. The jars are kept as
# artifacts.
name: Build

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # java_version from gradle.properties (21 for 1.21.x, 25 for 26.x); org.gradle.java.home points at a JDK on
      # the dev Mac and does not exist here
      - name: Prepare gradle.properties
        id: props
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          v=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$v" ]; then
            case "$(sed -n 's/^minecraft_version=//p' gradle.properties)" in 26*) v=25 ;; *) v=21 ;; esac
          fi
          echo "java=$v" >> "$GITHUB_OUTPUT"
          # Loom 1.13 needs Gradle on Java 21+: an older java_version (17 for 1.20.1) is only the toolchain
          if [ "$v" -lt 21 ]; then
            { echo "jdks<<EOF"; echo "$v"; echo 21; echo EOF; } >> "$GITHUB_OUTPUT"
          else
            echo "jdks=$v" >> "$GITHUB_OUTPUT"
          fi

      # the last JDK listed runs Gradle; the toolchain finds the other one
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.jdks }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --console=plain

      - name: GameTests (Forge)
        run: ./gradlew :forge:runGameTestServer --console=plain

      - name: GameTests (Fabric)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p fabric/run-gametest && echo "eula=true" > fabric/run-gametest/eula.txt
          ./gradlew :fabric:runGametest --console=plain

      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            */build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: ignore
