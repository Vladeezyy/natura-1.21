plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = forge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Forge 1.20.1 runs the tests in an ordinary server world (vanilla: a flat one): its own folder, flat
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
        }
        // Scripted test scene (com.progwml6.natura.client.DevScene): joins run/saves/natura_scene, screenshots the
        // blocks, items and machines to run/screenshots/scene_*.png and quits.
        scene {
            client()
            // a missing world is made by the scene itself (from the title screen)
            if (file('run/saves/natura_scene').exists()) {
                programArguments.addAll '--quickPlaySingleplayer', 'natura_scene'
            }
            systemProperty 'natura.scene', 'true'
        }
        // Screenshots of generated terrain (com.progwml6.natura.client.WorldgenScene): opens or creates run/saves/natura_gen.
        worldgenScene {
            client()
            systemProperty 'natura.worldgenScene', 'true'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    modCompileOnly "maven.modrinth:jade:${jade_version}+forge"
    modRuntimeOnly "maven.modrinth:jade:${jade_version}+forge"
}

// mods.toml comes from src/main/templates with the gradle properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// Forge 1.20.1's game test server is a dedicated server on server.properties: each run starts from a fresh flat world
def gameTestDir = file('run-gametest')
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        new File(gameTestDir, 'world').deleteDir()
        gameTestDir.mkdirs()
        new File(gameTestDir, 'server.properties').text = 'level-type=minecraft\\:flat\ngenerate-structures=false\nspawn-monsters=false\nonline-mode=false\n'
        new File(gameTestDir, 'eula.txt').text = 'eula=true\n'
    }
}
